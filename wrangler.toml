name = "alset-streaming-hub"
main = "src/index.js"
compatibility_date = "2026-09-20"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_classes = ["MatchRoom"]

# Optional: set STREAM_ADMIN_KEY in dashboard for creating matches / tickets
