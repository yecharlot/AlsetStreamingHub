name = "alset-streaming-hub"
main = "src/index.js"
compatibility_date = "2026-09-20"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "MatchRoom"

[[durable_objects.bindings]]
name = "SAAS"
class_name = "SaaSRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2-saas"
new_sqlite_classes = ["SaaSRegistry"]

# Secrets / vars en dashboard:
# STREAM_ADMIN_KEY, CALLS_APP_ID, CALLS_APP_SECRET
