<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Ver · Alset Live</title>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<div class="shell">
  <header class="brand">
    <div class="brand-mark">
      <div class="logo">RX</div>
      <div>
        <h1 id="title">Ver en vivo</h1>
        <p>Elige la cámara que mejor se vea</p>
      </div>
    </div>
    <a class="btn ghost" href="/" style="min-height:36px;padding:0.4rem 0.85rem;font-size:0.78rem">Inicio</a>
  </header>

  <div class="stage">
    <video id="remote" playsinline autoplay controls muted></video>
    <div class="live-badge" id="liveBadge"><i></i> EN VIVO</div>
  </div>

  <div class="bar">
    <span class="status" id="st">Conectando…</span>
    <button class="btn ghost" type="button" id="btnSound" style="min-height:36px;padding:0.4rem 0.85rem;font-size:0.78rem">Activar sonido</button>
  </div>

  <div class="card">
    <h2>Cámaras disponibles</h2>
    <p class="muted" id="hint">Cuando alguien transmita con el mismo evento, aparecerán aquí.</p>
    <div class="cams" id="cams"></div>
  </div>

  <pre class="out" id="log" style="display:none"></pre>
  <p class="foot">Si el video no arranca, toca la imagen o «Activar sonido».</p>
</div>
<script src="/hub.js"></script>
<script>
(function () {
  var H = window.AlsetHub;
  var matchId = H.qs("match", "evento-demo");
  var ticket = H.qs("ticket", "");
  var myId = "view-" + Math.random().toString(36).slice(2, 8);
  var st = document.getElementById("st");
  var logEl = document.getElementById("log");
  var camsEl = document.getElementById("cams");
  var video = document.getElementById("remote");
  var badge = document.getElementById("liveBadge");
  var producers = [], activeId = null, session = null, ws;

  function log(m) {
    logEl.style.display = "block";
    logEl.textContent = typeof m === "string" ? m : JSON.stringify(m, null, 2);
  }
  function setStatus(t, cls) {
    st.textContent = t;
    st.className = "status" + (cls ? " " + cls : "");
  }

  document.getElementById("btnSound").onclick = function () {
    video.muted = false;
    video.play().catch(function () {});
  };

  function renderCams() {
    var online = producers.filter(function (p) { return p.online; });
    var best = online.slice().sort(function (a, b) { return (b.quality || 0) - (a.quality || 0); })[0];
    document.getElementById("hint").style.display = online.length ? "none" : "block";
    camsEl.innerHTML = online.map(function (p) {
      var q = (p.quality || 0) >= 0.7 ? "q" : (p.quality || 0) >= 0.4 ? "q mid" : "q low";
      var act = p.id === activeId ? "active" : "";
      var bestCls = best && best.id === p.id ? "best" : "";
      return '<div class="cam ' + act + ' ' + bestCls + '" data-id="' + p.id + '">' +
        '<strong>' + (p.label || p.id) + '</strong>' +
        '<div class="' + q + '">' + Math.round((p.quality || 0) * 100) + '% calidad</div></div>';
    }).join("");
    Array.prototype.forEach.call(camsEl.querySelectorAll(".cam"), function (el) {
      el.onclick = function () { selectProducer(el.getAttribute("data-id")); };
    });
  }

  async function selectProducer(id) {
    if (!id || !ws) return;
    activeId = id;
    renderCams();
    var p = producers.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    if (session && session.close) try { session.close(); } catch (_) {}
    session = null;
    setStatus("Conectando cámara…");
    badge.classList.remove("on");

    if (p.sfuSessionId && p.tracks && p.tracks.length) {
      try {
        session = await H.sfuPull(p.sfuSessionId, p.tracks);
        video.srcObject = session.stream;
        video.muted = true;
        await video.play().catch(function () {});
        setStatus("Reproduciendo", "on");
        badge.classList.add("on");
        return;
      } catch (e) {
        log("Reintento directo: " + (e.message || e));
      }
    }
    try {
      session = await H.meshPull(ws, id, function (stream) {
        video.srcObject = stream;
        video.muted = true;
        video.play().catch(function () {});
        setStatus("Reproduciendo", "on");
        badge.classList.add("on");
      });
    } catch (e) {
      setStatus("No se pudo ver esta cámara", "err");
      log(String(e.message || e));
    }
  }

  ws = new WebSocket(H.wsUrl(matchId, { role: "viewer", id: myId, ticket: ticket }));
  ws.onopen = function () { setStatus("Conectado · esperando cámaras"); };
  ws.onerror = function () { setStatus("Sin conexión", "err"); log("WebSocket falló"); };
  ws.onclose = function (ev) {
    setStatus("Desconectado", "err");
    if (ev.code === 4003) log("Este evento pide un ticket válido");
  };
  ws.onmessage = function (ev) {
    var msg = JSON.parse(ev.data);
    if (msg.type === "room_state" || msg.type === "presence") {
      if (msg.meta && msg.meta.title) document.getElementById("title").textContent = msg.meta.title;
      producers = msg.producers || producers;
      renderCams();
      if (!activeId) {
        var best = producers.filter(function (p) { return p.online; }).sort(function (a, b) {
          return (b.quality || 0) - (a.quality || 0);
        })[0];
        if (best) selectProducer(best.id);
      }
    }
    if (msg.type === "producer_join") {
      producers = producers.filter(function (p) { return p.id !== msg.producer.id; }).concat([msg.producer]);
      renderCams();
      if (!activeId && msg.producer.online) selectProducer(msg.producer.id);
    }
    if (msg.type === "quality" && msg.producer) {
      producers = producers.map(function (p) {
        return p.id === msg.id ? Object.assign({}, p, msg.producer) : p;
      });
      renderCams();
    }
    if (msg.type === "signal" && msg.from === activeId && session && session.handleSignal) {
      session.handleSignal(msg.data);
    }
    if (msg.type === "program" && msg.producerId) selectProducer(msg.producerId);
  };
})();
</script>
</body>
</html>
