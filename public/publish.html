<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Transmitir · Alset Streaming</title>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>Transmitir</h1>
      <p class="tag">Cámara del partido · encode en este dispositivo</p>
    </div>
    <a class="btn" href="/">Inicio</a>
  </header>
  <div class="stage"><video id="local" muted playsinline autoplay></video></div>
  <div class="bar">
    <button class="btn primary" id="btnStart">Iniciar cámara</button>
    <button class="btn" id="btnStop" disabled>Detener</button>
    <span class="status" id="st">Listo</span>
  </div>
  <pre class="out" id="log">—</pre>
</div>
<script type="module">
import { wsUrl, createPeerConnection, getCameraStream, estimateQuality } from "./rtc.js";

const params = new URLSearchParams(location.search);
const matchId = params.get("match") || "partido-demo";
const label = params.get("label") || "Camara";
const myId = "pub-" + Math.random().toString(36).slice(2, 8);

const logEl = document.getElementById("log");
const st = document.getElementById("st");
const video = document.getElementById("local");
let stream, ws, pcs = new Map();

function log(m) { logEl.textContent = m; }

document.getElementById("btnStart").onclick = async () => {
  try {
    stream = await getCameraStream();
    video.srcObject = stream;
    st.textContent = "En vivo";
    st.classList.add("on");
    document.getElementById("btnStop").disabled = false;
    connect();
  } catch (e) {
    log("Cámara: " + e.message);
  }
};

document.getElementById("btnStop").onclick = () => {
  stream?.getTracks().forEach((t) => t.stop());
  ws?.close();
  pcs.forEach((pc) => pc.close());
  pcs.clear();
  st.textContent = "Detenido";
  st.classList.remove("on");
};

function connect() {
  ws = new WebSocket(wsUrl(matchId, { role: "publisher", id: myId, label }));
  ws.onopen = () => log("Conectado al hub · " + matchId + " · " + myId);
  ws.onclose = () => { st.textContent = "Desconectado"; st.classList.remove("on"); };
  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "signal" && msg.data) {
      await handleSignal(msg.from, msg.data);
    }
  };
  setInterval(async () => {
    if (!ws || ws.readyState !== 1) return;
    // report quality from first pc or baseline
    let q = { quality: 0.75, fps: 24, bitrate: 1 };
    for (const pc of pcs.values()) {
      q = await estimateQuality(pc);
      break;
    }
    ws.send(JSON.stringify({ type: "quality", ...q }));
  }, 4000);
}

async function handleSignal(from, data) {
  let pc = pcs.get(from);
  if (!pc) {
    pc = createPeerConnection();
    pcs.set(from, pc);
    stream.getTracks().forEach((t) => pc.addTrack(t, stream));
    pc.onicecandidate = (e) => {
      if (e.candidate && ws?.readyState === 1) {
        ws.send(JSON.stringify({ type: "signal", to: from, data: { candidate: e.candidate } }));
      }
    };
  }
  if (data.offer) {
    await pc.setRemoteDescription(data.offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    ws.send(JSON.stringify({ type: "signal", to: from, data: { answer } }));
  } else if (data.candidate) {
    try { await pc.addIceCandidate(data.candidate); } catch (_) {}
  }
}
</script>
</body>
</html>
