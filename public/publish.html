<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Transmitir</title>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>Transmitir</h1>
      <p class="tag">Cámara de campo · béisbol, fútbol u otro deporte</p>
    </div>
    <a class="btn" href="/">Inicio</a>
  </header>
  <div class="stage"><video id="local" muted playsinline autoplay></video></div>
  <div class="bar">
    <button class="btn primary" id="btnStart" type="button">Iniciar</button>
    <button class="btn" id="btnStop" type="button" disabled>Parar</button>
    <span class="status" id="st">Listo</span>
  </div>
  <pre class="out" id="log">Pulsa Iniciar y acepta cámara/micrófono.</pre>
</div>
<script src="/hub.js"></script>
<script>
(function () {
  var H = window.AlsetHub;
  var matchId = H.qs("match", "partido-demo");
  var label = H.qs("label", "Camara");
  var myId = "pub-" + Math.random().toString(36).slice(2, 8);
  var logEl = document.getElementById("log");
  var st = document.getElementById("st");
  var video = document.getElementById("local");
  var stream, ws, pub, mesh;

  function log(m) {
    logEl.textContent = typeof m === "string" ? m : JSON.stringify(m, null, 2);
  }

  document.getElementById("btnStart").onclick = async function () {
    try {
      st.textContent = "Cámara…";
      stream = await H.getCam();
      video.srcObject = stream;
      video.play().catch(function () {});
      st.textContent = "SFU…";
      pub = await H.sfuPublish(stream, myId);
      st.textContent = "En vivo";
      st.classList.add("on");
      document.getElementById("btnStop").disabled = false;
      connectWs();
      log({ ok: true, mode: "sfu", sessionId: pub.sessionId, tracks: pub.tracks });
    } catch (e) {
      st.textContent = "Error";
      log(String(e.message || e));
    }
  };

  document.getElementById("btnStop").onclick = function () {
    try { stream && stream.getTracks().forEach(function (t) { t.stop(); }); } catch (_) {}
    try { pub && pub.pc && pub.pc.close(); } catch (_) {}
    try { mesh && mesh.close(); } catch (_) {}
    try { ws && ws.close(); } catch (_) {}
    st.textContent = "Parado";
    st.classList.remove("on");
  };

  function connectWs() {
    ws = new WebSocket(H.wsUrl(matchId, { role: "publisher", id: myId, label: label }));
    mesh = H.meshPublisherAttach(stream, ws, myId);
    ws.onopen = function () {
      ws.send(JSON.stringify({ type: "sfu_publish", sessionId: pub.sessionId, tracks: pub.tracks }));
    };
    ws.onmessage = function (ev) {
      var msg = JSON.parse(ev.data);
      if (msg.type === "signal" && msg.data && mesh) {
        mesh.handleSignal(msg.from, msg.data);
      }
    };
    ws.onerror = function () { log("WebSocket error"); };
    setInterval(function () {
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: "quality", quality: 0.9, fps: 24, bitrate: 1 }));
      }
    }, 5000);
  }
})();
</script>
</body>
</html>
